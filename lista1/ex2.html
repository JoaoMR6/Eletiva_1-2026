<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 2 - Estilo Sample Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            padding-top: 50px;
        }
        .form-container {
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            max-width: 1000px;
            margin: auto;
        }
        
        @media (min-width: 576px) {
            .col-form-label {
                text-align: right;
            }
        }
        .section-title {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 25px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="form-container shadow-sm">
        <h2 class="section-title">Cadastro de Cliente</h2>
        
        <form>
            <div class="row mb-3 align-items-center">
                <label for="cod" class="col-sm-2 col-form-label fw-bold">Código</label>
                <div class="col-sm-2">
                    <input type="text" class="form-control" id="cod" value="32" disabled>
                </div>
                <label for="nameCli" class="col-sm-2 col-form-label fw-bold">Nome</label>
                <div class="col-sm-6">
                    <input type="text" class="form-control" id="nameCli" placeholder="Nome Completo do Cliente">
                </div>
            </div>

            <div class="row mb-3 align-items-center">
                <label for="email" class="col-sm-2 col-form-label fw-bold">E-mail</label>
                <div class="col-sm-4">
                    <input type="email" class="form-control" id="email" placeholder="cliente@dominio.com">
                </div>
                <label for="cpf" class="col-sm-2 col-form-label fw-bold">CPF</label>
                <div class="col-sm-4">
                    <input type="text" class="form-control" id="cpf" placeholder="Só números">
                </div>
            </div>

            <div class="row mb-3 align-items-center">
                <label for="celular" class="col-sm-2 col-form-label fw-bold">N° Celular</label>
                <div class="col-sm-4">
                    <input type="tel" class="form-control" id="celular" placeholder="(XX) XXXXX-XXXX">
                </div>
                <label for="fixo" class="col-sm-2 col-form-label fw-bold">Fixo</label>
                <div class="col-sm-4">
                    <input type="tel" class="form-control" id="fixo" placeholder="N° Telefone">
                </div>
            </div>

            <div class="row mb-3 align-items-center">
                <label for="cep" class="col-sm-2 col-form-label fw-bold">CEP</label>
                <div class="col-sm-3">
                    <input type="text" class="form-control" id="cep" placeholder="00000-000">
                </div>
                <label for="logra" class="col-sm-2 col-form-label fw-bold">Logradouro</label>
                <div class="col-sm-5">
                    <input type="text" class="form-control" id="logra" placeholder="Rua XXXX">
                </div>
            </div>

            <div class="row mb-3 align-items-center">
                <label for="numeroEnd" class="col-sm-2 col-form-label fw-bold">N°</label>
                <div class="col-sm-2">
                    <input type="text" class="form-control" id="numeroEnd" placeholder="N°">
                </div>
                <label for="bairro" class="col-sm-2 col-form-label fw-bold">Bairro</label>
                <div class="col-sm-6">
                    <input type="text" class="form-control" id="bairro" placeholder="ex: Jardim aviação">
                </div>
            </div>

            <div class="row mb-4 align-items-center">
                <label for="cidade" class="col-sm-2 col-form-label fw-bold">Cidade</label>
                <div class="col-sm-4">
                    <input type="text" id="cidade" class="form-control" placeholder="ex: Presidente Prudente">
                </div>
                <label for="uf" class="col-sm-1 col-form-label fw-bold text-nowrap">UF</label>
                <div class="col-sm-1">
                    <input type="text" id="uf" class="form-control" placeholder="UF">
                </div>
                <label for="status" class="col-sm-1 col-form-label fw-bold">Status</label>
                <div class="col-sm-3">
                    <select id="status" class="form-select">
                        <option selected>Selecione</option>
                        <option value="1">Ativo</option>
                        <option value="2">Inativo</option>
                    </select>
                </div>
            </div>

            <div class="text-center mt-5">
                <button type="reset" class="btn btn-outline-danger px-4 me-2">Resetar</button>
                <button type="submit" class="btn btn-success px-5">Próximo</button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
