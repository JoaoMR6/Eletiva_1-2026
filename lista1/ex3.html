<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 3 Bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background-size: cover;
        }

        .form-box{
            background: rgba(255,255,255,0,9);
            padding: 30px;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <div class="container py-5">

        <div class="form-box">
            <h2 class="text-center mb-4"> Sample form</h2>

            <div class="row mb-3">
                <label class="form-label">Partner name</label>
                <input type="text" class="form-control">
            </div>

            <div class="col-md-6">
                <label class="form-label">Partner email ID</label>
                <input type="email" class="form-control">
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-md-6">
                <label class="form-label">Partner Legal name</label>
                <input type="text" class="form-control">
            </div>

            <div class="col-md-6">
                <label class="form-label">Partner Mobile</label>
                <input type="text" class="form-control">
            </div> 
        </div>

        <div class="mb-3">
            <label class="form-label">Partner Adress</label>
            <input type="text" class="form-control">
        </div>

        <div class="row mb-3">
            <div class="col-md-6">
                <label class="form-label"> Contract Start</label>
                <input type="date" class="form-control">
            </div>

            <div class="col-md-6">
                <label class="form-label">Contract End</label>
                <input type="date" class="form-control">
            </div>
        </div>

        <div class="text-center">
            <button type="submit" class="btn btn-primary px-4">Submit</button>
        </div>
    </div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
