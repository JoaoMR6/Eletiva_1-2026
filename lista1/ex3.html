<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 3 Bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background-color: #f8f9fa;
            padding-top: 50px;
        }

        .form-container{
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            max-width: 900px;
            margin: auto;
        }

        .form-label{
            font-weight: 600;
            text-align: right;
        }

        @media (min-width:768px){
            .col-form-label{
                text-align: right;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <div class="form-container shadow-sm">
            <h2 class="text-center mb-4"> Sample form</h2>
            <form>
                <div class="row mb-3 align-items-center">
                    <label for="partnerName" class="col-sm-3 col-form-label">Partner Name</label>
                    <div class="col-sm-3">
                        <input type="text" class="form-control" id="partnerName">
                    </div>
                    <label for="partnerEmail" class="col-sm-2 col-form-label">Partner Email</label>
                     <div class="col-sm-4">
                        <input type="email" class="form-control" id="partnerEmail">
                    </div>
                </div>

               <div class="row mb-3 align-items-center">
                <label for="partnerLegalname" class="col-sm-3 col-form-label">Partner Legal Name</label>
                    <div class="col-sm-3">
                        <input type="text" class="form-control" id="partnerLegalame">
                    </div>
                    <label for="partnerMobile" class="col-sm-2 col-form-label">Partner Mobile</label>
                     <div class="col-sm-4">
                        <input type="email" class="form-control" id="partnerMobile">
                    </div>
               </div>

               <div class="row mb-3 align-items-center">
                <label for="partnerAdress" class="col-sm-3 col-form-label">Partner Adress</label>
                    <div class="col-sm-3">
                        <textarea class="form-control" id="partnerAdress" rows="2"></textarea>
                    </div>
               </div>

               <div class="row mb-3 align-items-center">
                <label for="contractStart" class="col-sm-3 col-form-label">Contract Start Date</label>
                    <div class="col-sm-3">
                        <input type="text" class="form-control" id="contractStart">
                    </div>
                    <label for="contractEnd" class="col-sm-3 col-form-label">Contract End Date</label>
                    <div class="col-sm-3">
                        <input type="text" class="form-control" id="contractEnd">
                    </div>
               </div>

               <div class="row mb-3 align-items-center">
                <label for="minLoan" class="col-sm-3 col-form-label">Minimum Loan Amount</label>
                <div class="col-sm-3">
                    <input type="number" class="form-control" id="minLoan">
                </div>
                <label for="maxLoan" class="col-sm-2 col-form-label">Maximum Loan Amount</label>
                <div class="col-sm-4">
                    <input type="number" class="form-control" id="maxLoan">
                </div>
            </div>

            <div class="row mb-4 align-items-center">
                <label for="interestRate" class="col-sm-3 col-form-label">Interest Rate</label>
                <div class="col-sm-3">
                    <input type="text" class="form-control" id="interestRate">
                </div>
                <label for="depositAmount" class="col-sm-2 col-form-label">Deposit Amount</label>
                <div class="col-sm-4">
                    <input type="number" class="form-control" id="depositAmount">
                </div>
            </div>

            <div class="text-center">
                <button type="submit" class="btn btn-primary px-5">Save</button>
            </div>
            </form>
        </div>

    </div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
